services:
  - type: web
    name: hrms-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    healthCheckPath: /api/v1/health

    envVars:
      # ─── Required – set these in the Render dashboard ─────────────────────────
      - key: DATABASE_URL
        sync: false          # Set manually in Render dashboard

      - key: SECRET_KEY
        sync: false          # Random 32+ char string

      - key: REDIS_PASSWORD
        sync: false

      - key: REDIS_HOST
        sync: false

      - key: REDIS_PORT
        sync: false

      - key: SMTP_PASSWORD
        sync: false

      # ─── Optional – override in dashboard if needed ────────────────────────────
      - key: DEBUG
        value: "False"

      - key: BACKEND_BASE_URL
        sync: false          # e.g. https://hrms-backend.onrender.com

      - key: BACKEND_CORS_ORIGINS
        sync: false          # e.g. https://your-frontend.onrender.com

      - key: FRONTEND_URL
        sync: false          # e.g. https://your-frontend.onrender.com

      - key: EMAIL_PROVIDER
        value: smtp

      - key: SMTP_HOST
        value: smtp.gmail.com

      - key: SMTP_PORT
        value: "587"

      - key: SMTP_USE_STARTTLS
        value: "True"

      - key: REDIS_SSL
        value: "True"

      - key: REDIS_USERNAME
        value: default
